<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="🐯 Pilingo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="pilingo-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="pilingo-icon-192.png">
<title>Final Test</title>
<style>
body{
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top right, rgba(206,191,255,0.36), transparent 26%),
linear-gradient(180deg, #f6f0ff 0%, #ece2ff 50%, #ddd0ff 100%);
text-align:center;
margin:0;
padding:calc(20px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
min-height:100vh;
min-height:100dvh;
box-sizing:border-box;
}

@media(max-width:600px){
body{padding:0;}
body .card{max-width:none;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));border:0;border-radius:0;box-shadow:none;}
}

.card{
background:rgba(255,255,255,0.95);
max-width:550px;
margin:auto;
padding:24px;
border-radius:15px;
border:2px solid #cfbef7;
box-shadow:0 10px 24px rgba(92,67,173,0.16);
}

.top-actions{
display:flex;
justify-content:flex-start;
margin-bottom:12px;
}

.back-button{
width:auto;
margin:0;
padding:12px 16px;
font-size:15px;
border:none;
border-radius:14px;
background:#f7f3ff;
color:#6a4dd1;
cursor:pointer;
box-shadow:0 4px 0 #cfbef7;
}

#visual{
font-size:82px;
line-height:1;
margin:12px 0 16px;
}

#hearts{
font-size:28px;
margin-bottom:10px;
}

#progress{
height:10px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-bottom:16px;
}

#bar{
height:100%;
width:0%;
background:linear-gradient(90deg, #8f6bff, #bf9bff);
}

#feedback{
min-height:24px;
font-weight:bold;
}

button{
display:block;
width:90%;
margin:10px auto;
padding:15px;
font-size:18px;
border:none;
border-radius:10px;
background:#7b5ae6;
color:white;
cursor:pointer;
box-shadow:0 4px 0 #5e43ba;
}

button.correct{
background:#58cc02 !important;
box-shadow:0 4px 0 #46a302 !important;
}
</style>
</head>
<body>
<script src="pilingo-auth.js?v=9"></script>
<script>PilingoAuth.requireAccount();</script>
<script src="pilingo-notify.js?v=9"></script>
<script>PilingoNotify.track("page_open", "Opened Game 7", { page:"game7" });</script>

<div class="card">
<div class="top-actions"><button class="back-button" onclick="goBackToGames()">← Choose another game</button></div>
<h2>Final Test</h2>
<div id="hearts"></div>
<div id="progress"><div id="bar"></div></div>
<div id="visual" aria-hidden="true"></div>
<h3 id="q"></h3>
<div id="options"></div>
<div id="feedback"></div>
</div>

<script src="engine-core.js"></script>
<script src="pilingo-sounds.js"></script>
<script src="pilingo-mascot.js?v=3"></script>
<script src="pilingo-mascot-bridge.js?v=2"></script>
<script src="pwa.js?v=10"></script>
<script>

let course=window.Engine?.getCourse ? Engine.getCourse() : (localStorage.getItem("course")||"en-ku");
let hearts=window.Engine?.getHearts ? Engine.getHearts() : parseInt(localStorage.getItem("hearts")||"5",10);

function goBackToGames(){
window.location.href="engine.html";
}

let q=[
{
q:"Cat",
visual:"🐱",
options:["Cat","Dog","Bird"],
answer:0
},
{
q:"Running",
visual:"🏃",
options:["Sleeping","Running","Eating"],
answer:1
},
{
q:"Two apples",
visual:"🍎 🍎",
options:["One apple","Two apples","Three apples"],
answer:1
},
{
q:"An apple",
visual:"🍎",
options:["a apple","an apple","the apple"],
answer:1
},
{
q:"This",
visual:"👇",
options:["That","This","He"],
answer:1
}
];

let current=0;

function renderHearts(){
let html="";
for(let i=0;i<hearts;i++) html+="❤️ ";
for(let i=hearts;i<5;i++) html+="🖤 ";
document.getElementById("hearts").innerHTML=html;
}

function update(){
document.getElementById("bar").style.width=(current/q.length)*100+"%";
}

function load(){
renderHearts();
update();
let x=q[current];
document.getElementById("visual").innerText=x.visual;
document.getElementById("q").innerText=x.q;
document.getElementById("options").innerHTML=
x.options.map((o,i)=>`<button onclick="check(${i}, this)">${o}</button>`).join("");
document.getElementById("feedback").innerText="";
}

function check(i, button){
if(i===q[current].answer){
PilingoAudio.playCorrect();
if(button) button.classList.add("correct");
document.getElementById("feedback").innerText="✅ Correct";
current++;
setTimeout(()=>{
if(current<q.length){
load();
}else{
finish();
}
},650);
}else{
PilingoAudio.playWrong();
hearts=window.Engine?.loseHeart ? Engine.loseHeart() : Math.max(0,hearts-1);
localStorage.setItem("hearts",hearts);
renderHearts();
document.getElementById("feedback").innerText="❌ Try again";
if(hearts<=0) gameOver();
}
}

function showLessonComplete(){
  const card = document.querySelector(".card");
  if(!card) return;
  card.innerHTML = `
<h2>Great job!</h2>
<p>You finished this lesson.</p>
`;
}

function gameOver(){
document.body.innerHTML=`
<div class="card">
<h1>💔</h1>
<h2>Out of hearts</h2>
<button onclick="location.reload()">Try again</button>
</div>`;
}

function finish(){
PilingoAudio.playLessonComplete();
  showLessonComplete();
  PilingoAudio.speak("Great job! You finished this lesson.");

let xpKey=course+"_xp";
let unlockKey=course+"_unlocked";

let xp=parseInt(localStorage.getItem(xpKey)||"0");
localStorage.setItem(xpKey,xp+20);
localStorage.setItem("skill_6","4");
if(window.Engine?.resetHearts) Engine.resetHearts();
document.getElementById("bar").style.width="100%";

setTimeout(()=>window.location.href="engine.html",2200);
}

load();

</script>

</body>
</html>
